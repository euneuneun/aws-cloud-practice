spring:
  application:
    name: aws-cloud-practice
  profiles:
    default: local   # 프로필 지정 없이 실행하면 local 사용 (prod는 SPRING_PROFILES_ACTIVE=prod로 덮어씀)
  cloud:
    aws:
      region:
        static: ap-northeast-2
      parameterstore:
        enabled: false   # 기본(로컬)은 AWS Parameter Store 끔 → prod에서만 켬
      s3:
        bucket: camp-health-kde-files
  servlet:
    multipart:
      max-file-size: 10MB # 파일 업로드 크기 제한

cloudfront:
  domain: d3hzsvsrcwxkah.cloudfront.net   # S3 이미지 조회용 CloudFront 배포 도메인

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info