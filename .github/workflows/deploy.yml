name: CI/CD

# PR(→ main): CI만 실행 (빌드 + 테스트 + 스타일 검사)
# main push(= PR merge): CI 통과 후 CD(Docker Hub push + ASG 인스턴스 새로 고침)까지 실행
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # ===== CI: 빌드 + 테스트 + 스타일 검사 =====
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle   # 의존성 캐시 → 다음 실행부터 빌드 속도 향상

      - name: Build & Test
        run: |
          chmod +x gradlew
          ./gradlew build   # 테스트 + spotlessCheck 포함

      # CI 결과를 Discord로 알림 (PR 생성/수정, main merge 시)
      - name: Discord 알림
        if: always()   # 앞 단계가 실패해도 실행 → 실패 알림도 보냄
        env:
          # PR 제목 등은 run에 직접 넣지 않고 env로 전달 (스크립트 인젝션 방지)
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            ICON="✅ CI 통과"
          else
            ICON="❌ CI 실패"
          fi
          MESSAGE="$ICON
          제목: $TITLE
          작성자: $ACTOR
          결과 보기: $RUN_URL"
          jq -n --arg content "$MESSAGE" '{content: $content}' \
            | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"

  # ===== CD: Docker Hub push → ASG 인스턴스 새로 고침 =====
  cd:
    needs: ci                          # CI가 성공해야 실행
    if: github.event_name == 'push'    # PR에서는 배포하지 않음
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # AWS에 키 없이 로그인(OIDC)하려면 GitHub이 발급하는 토큰이 필요
      contents: read    # Checkout용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      # job마다 새 서버라서 jar를 다시 만들어야 함 (테스트는 CI에서 이미 통과)
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # EC2가 ARM(arm64) 서버라서, amd64인 GitHub 서버에서 arm64 이미지도 만들 수 있게 준비
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3   # 다른 CPU(arm64)를 흉내 내는 도구

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # 여러 CPU용 이미지를 한 번에 만드는 빌드 도구

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # 두 CPU용 이미지를 모두 만들어서 하나의 태그로 push
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/aws-cloud-practice:latest

      # Access Key 없이 OIDC로 AWS 역할을 잠깐 빌려 씀
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # EC2는 Private Subnet이라 SSH로 접속할 수 없음
      # → ASG에 "서버를 새로 만들어 교체해 줘"라고 요청하면, 새 서버가 사용자 데이터로 최신 이미지를 받아 실행
      # MinHealthyPercentage 100 + MaxHealthyPercentage 200: 새 서버가 healthy가 된 뒤에 기존 서버를 지움 (중단 없음)
      - name: Deploy (ASG instance refresh)
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name app-asg \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300}' \
            --query InstanceRefreshId --output text)
          echo "Instance refresh 시작: $REFRESH_ID"

          # 교체가 끝날 때까지 30초마다 확인 (최대 20분)
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name app-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "[$i] $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              exit 1
            fi
            sleep 30
          done
          echo "20분 안에 교체가 끝나지 않았습니다"
          exit 1

      # 배포 결과를 Discord로 알림
      - name: Discord 알림
        if: always()   # 앞 단계가 실패해도 실행 → 실패 알림도 보냄
        env:
          # 커밋 메시지 등은 run에 직접 넣지 않고 env로 전달 (스크립트 인젝션 방지)
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          TITLE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            ICON="🚀 배포 완료"
          else
            ICON="❌ 배포 실패"
          fi
          MESSAGE="$ICON
          제목: $TITLE
          작성자: $ACTOR
          결과 보기: $RUN_URL"
          jq -n --arg content "$MESSAGE" '{content: $content}' \
            | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"
