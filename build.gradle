plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'   // 코드 포맷 검사/자동 정리 (build 시 spotlessCheck 자동 실행)
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'aws-cloud-practice'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ===== Spring Boot =====
    implementation 'org.springframework.boot:spring-boot-starter-actuator'      // 헬스 체크(/actuator/health) 등 모니터링 엔드포인트
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'      // JPA(Hibernate)로 DB 접근
    implementation 'org.springframework.boot:spring-boot-starter-validation'    // @Valid, @NotBlank 등 요청값 검증
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'        // REST API(Spring MVC) + 내장 Tomcat
    implementation 'org.springframework.boot:spring-boot-h2console'             // H2 웹 콘솔(/h2-console), local 프로필에서 사용
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'       // AOP 의존성

    // ===== Spring Cloud AWS =====
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.0.0-RC1')  // Spring Cloud AWS BOM: 아래 AWS 모듈들의 버전을 한 곳에서 맞춰 관리 (개별 버전 생략 가능)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'           // AWS SSM Parameter Store 값을 설정(yaml, @Value)으로 불러옴 (DB 비밀번호 등)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'                        // AWS S3 연동 (S3Client, S3Template으로 파일 업로드/다운로드)

    // ===== Lombok =====
    compileOnly 'org.projectlombok:lombok'          // @Slf4j로 log 객체 자동 생성 (로그 출력용)
    annotationProcessor 'org.projectlombok:lombok'  // 컴파일할 때 Lombok 어노테이션을 처리

    // ===== DB 드라이버 (코드에서 직접 쓰지 않고, 실행 시 yaml 설정에 따라 로드됨) =====
    runtimeOnly 'com.h2database:h2'                 // 로컬 개발용 인메모리 DB (local 프로필)
    runtimeOnly 'com.mysql:mysql-connector-j'       // 운영 DB(MySQL) 연결 (prod 프로필)

    // ===== 테스트 =====
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'   // MockMvc 등 웹 계층 테스트
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'                    // JUnit 5 테스트 실행기
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 불가능한 plain jar 생성을 막음 → build/libs에 실행 가능한 jar 하나만 남아 Dockerfile의 COPY *.jar가 깨지지 않음
tasks.named('jar') {
    enabled = false
}

// 코드 스타일: ./gradlew spotlessApply 로 자동 정리, build 시 spotlessCheck 로 검사
spotless {
    java {
        googleJavaFormat().aosp()   // 구글 Java 스타일 (aosp = 들여쓰기 4칸)
        removeUnusedImports()       // 안 쓰는 import 제거
    }
}
